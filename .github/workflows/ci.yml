name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Build with a current toolchain: Go <= 1.23 links Mach-O binaries
          # without LC_UUID, which dyld on macOS 26 refuses to load. go.mod keeps
          # `go 1.22` so the source still builds for anyone on an older Go.
          go-version: stable
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: selftest binary
        run: go run . -mode selftest

  formatting:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Build with a current toolchain: Go <= 1.23 links Mach-O binaries
          # without LC_UUID, which dyld on macOS 26 refuses to load. go.mod keeps
          # `go 1.22` so the source still builds for anyone on an older Go.
          go-version: stable
          cache: false
      - name: gofmt -l
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "files that need gofmt:"
            echo "$out"
            exit 1
          fi
          echo "all files are gofmt-clean"
